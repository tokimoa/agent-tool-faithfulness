[project]
name = "uptake-probe"
version = "0.1.0"
description = "Judge-free diagnostic benchmark for tool-result mis-grounding in LLM agents (planted nonce values, exact-match scoring)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Apple-Silicon local inference backend (MLX). Install with: uv sync --extra mlx
mlx = ["mlx-lm>=0.19"]
# Frontier API upper-bound (optional). Install with: uv sync --extra api
api = ["anthropic>=0.40"]
# Figures. Install with: uv sync --extra viz
viz = ["matplotlib>=3.8"]

[dependency-groups]
# Installed by default on `uv sync`.
dev = [
    "hf-transfer>=0.1.9",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uptake_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
